<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">

<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/layout.css">
<title>Foro · DEEPSEEKAI</title>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="index.html">DEEPSEEKAI</a>
    <div>
      <div class="side__label">Subforos</div>
      <nav class="side__list" id="side-boards" aria-label="Subforos"></nav>
    </div>
  </aside>
  <main class="content">
    <div class="top">
      <nav>
        <span id="guest" hidden><a href="login.html">Iniciar sesión</a> · <a href="register.html">Registrarse</a></span>
        <span id="user" hidden><span id="who"></span> · <button class="link" id="logout" type="button">Cerrar sesión</button></span>
      </nav>
    </div>
    <h2>Últimas publicaciones</h2>
    <p class="sub">Elige un subforo en el menú de la izquierda.</p>
    <section id="feed" aria-live="polite">Cargando…</section>
    <noscript><p class="msg">Activa JavaScript para ver el foro.</p></noscript>
  </main>
</div>
<script src="js/api.js" onerror="document.querySelector('main').insertAdjacentHTML('beforeend','<p class=\'msg\'>No se pudo cargar '+this.getAttribute('src')+'. Comprueba que existe en public/js/.</p>')"></script>

<script src="js/board-list.js" onerror="document.querySelector('main').insertAdjacentHTML('beforeend','<p class=\'msg\'>No se pudo cargar '+this.getAttribute('src')+'. Comprueba que existe en public/js/.</p>')"></script>
